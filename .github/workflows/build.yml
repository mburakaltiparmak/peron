# Builds, tests and packages Peron.
# - Push / PR: lint + tests (Rust + UI) on Windows and Linux, bundles uploaded as artifacts,
#   plus the Microsoft Store MSIX (Windows).
# - Tags "v*": a separate, write-permitted job drafts a GitHub release with the direct-download
#   installers (NSIS, deb, rpm, AppImage). Tags with "-" (v0.1.0-beta.1) become pre-releases.
#   Release asset URLs never change once published → use them as the Partner Center / site links.
#
# Secrets:   WEB3FORMS_FORM_ACCESS_KEY  (feedback form; without it the form falls back to mailto)
# Variables: MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME
#            (Partner Center → Product identity; placeholders are used for branch/PR builds,
#            tag builds fail until all three are set)
#
# Third-party actions are pinned to commit SHAs (tag in the trailing comment).
name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WEB3FORMS_FORM_TO_MAIL: mburakaltiparmak@gmail.com

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    env:
      WEB3FORMS_FORM_ACCESS_KEY: ${{ secrets.WEB3FORMS_FORM_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev rpm python3 musl-tools

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.name == 'linux' && 'x86_64-unknown-linux-musl' || '' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: UI type-check and tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: "Rust lint and tests (workspace: app, peron-core, peron-cli)"
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace -- --include-ignored

      - name: peron-cli (static musl on Linux; shipped in .deb/.rpm and as a release asset)
        shell: bash
        run: |
          mkdir -p src-tauri/bin dist-cli
          if [ "${{ matrix.name }}" = "linux" ]; then
            cargo build --manifest-path src-tauri/Cargo.toml --release -p peron-cli --target x86_64-unknown-linux-musl
            cp src-tauri/target/x86_64-unknown-linux-musl/release/peron-cli src-tauri/bin/peron-cli
            cp src-tauri/bin/peron-cli dist-cli/peron-cli-x86_64-linux
          else
            cargo build --manifest-path src-tauri/Cargo.toml --release -p peron-cli
            cp src-tauri/target/release/peron-cli.exe dist-cli/peron-cli-x86_64-windows.exe
          fi

      - name: Build bundles
        run: npx tauri build
        env:
          NO_STRIP: "true"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peron-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            dist-cli/*
          if-no-files-found: error

      # Placeholder identity is fine for branch/PR builds, never for a release: Partner Center
      # rejects it, and a tag build must produce the package that actually gets submitted.
      - name: Require the real MSIX identity on release tags
        if: matrix.name == 'windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $missing = 'MSIX_IDENTITY_NAME', 'MSIX_PUBLISHER', 'MSIX_PUBLISHER_DISPLAY_NAME' |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) {
            Write-Error "Release tag without the Partner Center identity; set repository variables: $($missing -join ', ')"
            exit 1
          }
          if ($env:MSIX_IDENTITY_NAME -match 'Placeholder' -or $env:MSIX_PUBLISHER -match 'Placeholder') {
            Write-Error 'MSIX identity variables still contain placeholder values.'
            exit 1
          }

      - name: Microsoft Store package (MSIX)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          ./packaging/msix/build-msix.ps1 -SkipBuild `
            -IdentityName "${{ vars.MSIX_IDENTITY_NAME || 'Peron.Placeholder' }}" `
            -Publisher "${{ vars.MSIX_PUBLISHER || 'CN=Peron Placeholder' }}" `
            -PublisherDisplayName "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'M. Burak Altıparmak' }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.name == 'windows'
        with:
          name: peron-msix
          path: src-tauri/target/msix/*.msix
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      WEB3FORMS_FORM_ACCESS_KEY: ${{ secrets.WEB3FORMS_FORM_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev rpm musl-tools

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ runner.os == 'Linux' && 'x86_64-unknown-linux-musl' || '' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: peron-cli
        shell: bash
        run: |
          mkdir -p src-tauri/bin dist-cli
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo build --manifest-path src-tauri/Cargo.toml --release -p peron-cli --target x86_64-unknown-linux-musl
            cp src-tauri/target/x86_64-unknown-linux-musl/release/peron-cli src-tauri/bin/peron-cli
            cp src-tauri/bin/peron-cli dist-cli/peron-cli-x86_64-linux
          else
            cargo build --manifest-path src-tauri/Cargo.toml --release -p peron-cli
            cp src-tauri/target/release/peron-cli.exe dist-cli/peron-cli-x86_64-windows.exe
          fi

      - name: Draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Peron ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md. Microsoft Store users are updated through the Store.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      # The Servers dialog links to releases/download/v<version>/peron-cli-x86_64-linux.
      - name: Attach peron-cli to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist-cli/* --clobber
